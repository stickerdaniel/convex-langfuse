# Runs the load, outage, backlog threshold and prompt refresh drivers of
# `integration/load.mjs`, each on a runner of its own. They measure latency
# and rates, so they need an idle machine. Started by hand only: the longest
# driver takes about 17 minutes.
name: Load drivers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load:
    name: Driver
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        driver: ["load", "outage", "threshold", "threshold --kill", "prompts"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node setup
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install and build
        run: |
          npm ci
          npm run build

      # The driver and its option are two words on purpose.
      - name: Run the driver
        env:
          DRIVER: ${{ matrix.driver }}
        run: node integration/load.mjs $DRIVER --out load-results.json

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-results-${{ strategy.job-index }}
          path: load-results.json
          if-no-files-found: ignore
