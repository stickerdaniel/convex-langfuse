name: Langfuse contract
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versions:
    name: Supported Langfuse versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.read.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: read
        run:
          echo "versions=$(jq -c '[.stacks[].langfuse]'
          contract/supported.json)" >> "$GITHUB_OUTPUT"

  contract:
    name: Contract on Langfuse ${{ matrix.langfuse }}
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        langfuse: ${{ fromJSON(needs.versions.outputs.versions) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node setup
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install and build
        run: |
          npm ci
          npm run build

      # Starts the stack, runs the cases, scans the logs for every generated
      # secret and removes the stack. A found secret fails the step and
      # deletes the logs before the upload.
      - name: Contract suite
        env:
          LANGFUSE_VERSION: ${{ matrix.langfuse }}
        run: npm run test:contract -- --langfuse "$LANGFUSE_VERSION"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-logs-${{ matrix.langfuse }}
          path: contract/logs/
          if-no-files-found: ignore

      - name: Remove leftover stacks
        if: always()
        run: |
          docker compose ls --all --format json |
            jq -r '.[].Name | select(startswith("convex-langfuse-contract-"))' |
            xargs -r -I{} docker compose -p {} down --volumes --remove-orphans

  faults:
    name: Fault check on Langfuse ${{ matrix.langfuse }}
    if: github.event_name != 'pull_request'
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        langfuse: ${{ fromJSON(needs.versions.outputs.versions) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node setup
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Fault check
        env:
          LANGFUSE_VERSION: ${{ matrix.langfuse }}
        run: npm run test:contract:faults -- --langfuse "$LANGFUSE_VERSION"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-fault-logs-${{ matrix.langfuse }}
          path: contract/logs/
          if-no-files-found: ignore

      - name: Remove leftover stacks
        if: always()
        run: |
          docker compose ls --all --format json |
            jq -r '.[].Name | select(startswith("convex-langfuse-contract-"))' |
            xargs -r -I{} docker compose -p {} down --volumes --remove-orphans
