name: Release

# Publishes the package to npm when a tag `v<version>` is pushed, through npm
# trusted publishing: the publish job proves its identity with a GitHub OIDC
# token, so no npm token is stored anywhere. The trusted publisher on npm
# names this file and the environment `npm`.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  pack:
    name: Test and pack
    if: github.repository == 'stickerdaniel/convex-langfuse'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.pack.outputs.version }}
      sha256: ${{ steps.pack.outputs.sha256 }}
      publish: ${{ steps.pack.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node setup
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Test
        run: |
          npm ci
          npm run build
          npm test
          npm run typecheck
          npm run lint

      - name: Pack and check
        id: pack
        env:
          OUT: ${{ runner.temp }}/release
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          version="$(jq -r .version package.json)"
          [ "$GITHUB_REF_NAME" = "v$version" ] || fail "Tag $GITHUB_REF_NAME does not name version $version."
          # A clean build: a leftover build info file makes tsc skip files.
          rm -rf dist ./*.tsbuildinfo
          mkdir -p "$OUT"
          npm pack --pack-destination "$OUT" > /dev/null
          mv "$OUT"/*.tgz "$OUT/package.tgz"
          tar -tzf "$OUT/package.tgz" > "$OUT/files.txt"
          manifest="$(tar -xOzf "$OUT/package.tgz" package/package.json)"
          [ "$(jq -r .name <<<"$manifest")" = "@stickerdaniel/convex-langfuse" ] || fail "Unexpected package name."
          [ "$(jq -r .version <<<"$manifest")" = "$version" ] || fail "Tarball version differs."
          # Every file the exports map names is in the tarball.
          for file in $(jq -r '.exports | .. | strings' <<<"$manifest" | sort -u); do
            grep -qx "package/${file#./}" "$OUT/files.txt" || fail "The tarball lacks $file."
          done
          ! grep -E '\.test(-d|-util)?\.ts$' "$OUT/files.txt" || fail "The tarball holds test files."
          status="$(curl --silent --show-error --retry 3 --max-time 30 --output /dev/null \
            --write-out '%{http_code}' "https://registry.npmjs.org/@stickerdaniel%2fconvex-langfuse/$version")"
          case "$status" in
            200) publish=false; echo "Version $version is already on npm." ;;
            404) publish=true ;;
            *) fail "npm lookup answered HTTP $status." ;;
          esac
          {
            echo "version=$version"
            echo "sha256=$(sha256sum "$OUT/package.tgz" | cut -d' ' -f1)"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/release/package.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: pack
    if: needs.pack.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url:
        https://www.npmjs.com/package/@stickerdaniel/convex-langfuse/v/${{
        needs.pack.outputs.version }}
    permissions:
      id-token: write
    steps:
      # This job holds the publishing identity and runs no repository code.
      - name: Node setup
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
          registry-url: https://registry.npmjs.org

      - name: Require npm with trusted publishing
        run: printf '11.5.1\n%s\n' "$(npm --version)" | sort -V -C

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/release

      - name: Publish the tested tarball
        env:
          TARBALL: ${{ runner.temp }}/release/package.tgz
          SHA256: ${{ needs.pack.outputs.sha256 }}
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          set -euo pipefail
          [ "$(sha256sum "$TARBALL" | cut -d' ' -f1)" = "$SHA256" ] || { echo "::error::The tarball differs from the tested one."; exit 1; }
          npm publish "$TARBALL" --access public --ignore-scripts
          echo "Published @stickerdaniel/convex-langfuse@$VERSION" >> "$GITHUB_STEP_SUMMARY"
